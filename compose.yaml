name: electrumx-ravencoin

x-core-build: &core-build
  context: .
  dockerfile: docker/core/Dockerfile
  args:
    RAVENCOIN_VERSION: 4.8.0
    RAVENCOIN_SOURCE_COMMIT: 22549129888d02e0e08fcdb9f96f3c699167e774
    RAVENCOIN_ARCHIVE_SHA256: cb359b6a5b42e47068cd655231484fcc763d2f79eae5ea318b029c704a4dc020
    RAVENCOIN_SOURCE_ARCHIVE_SHA256: 0fba4c8979c7ebed3457d91957f886292ea53e62857c636c70e3aa0478017d6e
    RAVEND_SHA256: 885f6670c819e3a48339bbc596f1a224fe41af21ae7a0db57b2ebca700d050ea
    RAVEN_CLI_SHA256: 8fde2465b2bd50d0db2d873fd02a6a4ce6a6be84ed03d32b094a9862febb594b

services:
  rpc-secrets-init:
    build: *core-build
    image: alenoc/ravencoin-core:4.8.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        cp /run/secrets/raven_rpc_user /prepared/raven_rpc_user
        cp /run/secrets/raven_rpc_password /prepared/raven_rpc_password
        chmod 0444 /prepared/raven_rpc_user /prepared/raven_rpc_password
    secrets:
      - raven_rpc_user
      - raven_rpc_password
    volumes:
      - rpc-secrets:/prepared
    network_mode: none
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE

  ravencoin-core:
    build: *core-build
    image: alenoc/ravencoin-core:4.8.0
    depends_on:
      rpc-secrets-init:
        condition: service_completed_successfully
    environment:
      RAVEN_RPC_USER_FILE: /run/raven-secrets/raven_rpc_user
      RAVEN_RPC_PASSWORD_FILE: /run/raven-secrets/raven_rpc_password
      # This healthcheck is a readiness gate for ElectrumX, not merely an RPC
      # liveness probe.  Defaults keep ElectrumX stopped/retrying until Core
      # has peers, a fresh tip, and is within two blocks of its best headers.
      RAVENCOIN_HEALTH_MAX_BLOCK_LAG: ${RAVENCOIN_HEALTH_MAX_BLOCK_LAG:-2}
      RAVENCOIN_HEALTH_MAX_TIP_AGE: ${RAVENCOIN_HEALTH_MAX_TIP_AGE:-1800}
      RAVENCOIN_HEALTH_MIN_PEERS: ${RAVENCOIN_HEALTH_MIN_PEERS:-1}
    networks:
      ravencoin-backend:
        ipv4_address: 172.29.80.10
    ports:
      - "8767:8767/tcp"
    volumes:
      - ravencoin-data:/var/lib/ravencoin
      - ravencoin-config:/var/lib/ravencoin-config
      - rpc-secrets:/run/raven-secrets:ro
    # Reboot resilience: unlike on-failure:N, this survives daemon/host
    # restarts and does not exhaust a finite retry budget after a blackout.
    restart: unless-stopped
    stop_grace_period: 30m
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "ravencoin-healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 5m

  electrumx:
    build:
      context: .
      dockerfile: contrib/Dockerfile
    image: alenoc/electrumx-ravencoin:1.13.9
    depends_on:
      ravencoin-core:
        condition: service_healthy
        restart: true
    environment:
      COIN: Ravencoin
      NET: mainnet
      DB_DIRECTORY: /var/lib/electrumx/db
      SERVICES: tcp://:50001,rpc://127.0.0.1:8000,rpc://${ELECTRUMX_MONITOR_ADMIN_IP:-172.29.81.2}:8001
      EVENT_LOOP_POLICY: uvloop
      CACHE_MB: ${ELECTRUMX_CACHE_MB:-1200}
      # ElectrumX charges one cost unit per BANDWIDTH_UNIT_COST bytes sent and
      # aggregates that cost per /24 client group.  At the upstream default of
      # 500 a single large blockchain.scripthash.get_history reply (2.5 MB)
      # costs 5,000, so two of them cross COST_SOFT_LIMIT and the server starts
      # inserting REQUEST_SLEEP delays into ordinary wallet traffic.  Measured
      # on the reference deployment: five consecutive 2.5 MB history queries
      # held round-trip latency at 10 ms with this value, against 87 ms to
      # 227 ms and no recovery at the default.  Request, subscription and
      # merkle costs are untouched, so the CPU-side DoS ceiling is unchanged.
      BANDWIDTH_UNIT_COST: ${ELECTRUMX_BANDWIDTH_UNIT_COST:-5000}
      COST_SOFT_LIMIT: ${ELECTRUMX_COST_SOFT_LIMIT:-10000}
      COST_HARD_LIMIT: ${ELECTRUMX_COST_HARD_LIMIT:-100000}
      RAVENCOIN_BACKEND_CHECK_INTERVAL: 60
      RAVENCOIN_BACKEND_INFO_MAX_AGE: 5
      RAVEN_RPC_USER_FILE: /run/raven-secrets/raven_rpc_user
      RAVEN_RPC_PASSWORD_FILE: /run/raven-secrets/raven_rpc_password
      RAVENCOIN_DAEMON_HOST: ravencoin-core
      RAVENCOIN_DAEMON_PORT: 8766
      # Where the bundled Core came from.  These values are the same ones the
      # Core image build verifies by digest, so this deployment can honestly
      # publish BUILD_IDENTITY_VERIFIED.  They are configuration, never read
      # back from the running daemon, so a compromised daemon cannot choose its
      # own identity.
      RAVENCOIN_SOURCE_REPOSITORY: RavenProject/Ravencoin
      RAVENCOIN_SOURCE_TAG: v4.8.0
      RAVENCOIN_SOURCE_COMMIT: 22549129888d02e0e08fcdb9f96f3c699167e774
      RAVENCOIN_ARTIFACT_SHA256: cb359b6a5b42e47068cd655231484fcc763d2f79eae5ea318b029c704a4dc020
      RAVENCOIN_IDENTITY_EVIDENCE: BUILD_IDENTITY_VERIFIED
    networks:
      ravencoin-backend:
        ipv4_address: 172.29.80.20
      monitor-admin:
        ipv4_address: ${ELECTRUMX_MONITOR_ADMIN_IP:-172.29.81.2}
    ports:
      - "127.0.0.1:50001:50001/tcp"
    volumes:
      - electrumx-data:/var/lib/electrumx/db
      - rpc-secrets:/run/raven-secrets:ro
    # ElectrumX can legitimately exit while Core catches up after an abrupt
    # reboot.  Retry indefinitely with Docker's backoff instead of giving up
    # after five starts; the Core readiness gate prevents this on normal up.
    restart: unless-stopped
    stop_grace_period: 15m
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 10000
        hard: 10000
    healthcheck:
      test: ["CMD", "electrumx_rpc", "getinfo"]
      interval: 60s
      timeout: 35s
      retries: 5
      start_period: 5m

secrets:
  raven_rpc_user:
    file: .secrets/raven_rpc_user
  raven_rpc_password:
    file: .secrets/raven_rpc_password

networks:
  ravencoin-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.80.0/24
  monitor-admin:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${MONITOR_ADMIN_SUBNET:-172.29.81.0/29}

volumes:
  ravencoin-data:
  ravencoin-config:
  electrumx-data:
  rpc-secrets:
