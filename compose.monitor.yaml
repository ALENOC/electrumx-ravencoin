services:
  monitor:
    build:
      context: ./vendor/ravencoin-node-monitor
    image: electrumx-ravencoin-node-monitor:bundled
    container_name: ravencoin-node-monitor
    restart: unless-stopped
    depends_on:
      electrumx:
        condition: service_healthy
    # ElectrumX admin RPC is intentionally loopback-only. Sharing its network
    # namespace lets the monitor reach 127.0.0.1:8000 without publishing that
    # privileged RPC anywhere. The dashboard port is therefore published on
    # the electrumx container below, not on this service.
    network_mode: "container:electrumx-ravencoin-electrumx-1"
    env_file:
      - ./vendor/ravencoin-node-monitor/.env
    environment:
      CORE_RPC_HOST: ravencoin-core
      CORE_RPC_PORT: "8766"
      CORE_RPC_USER_FILE: /run/raven-secrets/raven_rpc_user
      CORE_RPC_PASSWORD_FILE: /run/raven-secrets/raven_rpc_password
      ELECTRUMX_ENABLED: "true"
      ELECTRUMX_RPC_HOST: 127.0.0.1
      ELECTRUMX_RPC_PORT: "8000"
      ELECTRUMX_SSL_HOST: 127.0.0.1
      ELECTRUMX_SSL_PORT: "50002"
    volumes:
      - rpc-secrets:/run/raven-secrets:ro
      - monitor-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    ports: []

  electrumx:
    ports:
      - "127.0.0.1:8899:8899/tcp"

volumes:
  monitor-data:
