name: Installer UX and ChainStrap progress gate

on:
  push:
    branches:
      - work/chainstrap-ravenproject
  pull_request:

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
          cache: pip

      - name: Verify migration ancestry and apply deterministic candidate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bdf4bec075f2883495b3142d89f028e69a3ab689 HEAD
          test -f core-safety/scripts/apply_installer_ux_progress.py
          python3 core-safety/scripts/apply_installer_ux_progress.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('core-safety/scripts/test_installer.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "ELECTRUMX RAVENCOIN" in lines\n    assert "Verified Node Installer" in lines\n'
          new = ('    assert any(line.strip() == "ELECTRUMX RAVENCOIN" for line in lines)\n'
                 '    assert any(line.strip() == "Verified Node Installer" for line in lines)\n')
          if text.count(old) != 1:
              raise SystemExit('centered-banner test anchor is not unique')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          python3 -m py_compile electrumx-ravencoin-install.py

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake libleveldb-dev
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install cryptography==43.0.3 pytest==8.3.5 pytest-asyncio==0.24.0 flake8==7.1.1

      - name: Run installer and ChainStrap regressions
        run: |
          set -euo pipefail
          pytest -q core-safety/scripts/test_installer.py tests/test_installer_storage.py tests/test_chainstrap_bootstrap.py

      - name: Run complete test suite
        run: pytest -q

      - name: Validate Compose models
        run: |
          set -euo pipefail
          mkdir -p .secrets vendor/ravencoin-node-monitor
          printf 'ci-user\n' > .secrets/raven_rpc_user
          printf 'ci-password-not-for-production\n' > .secrets/raven_rpc_password
          cp .env.example .env
          : > vendor/ravencoin-node-monitor/.env
          STORAGE_TEST_ROOT="$RUNNER_TEMP/electrumx-storage"
          mkdir -p "$STORAGE_TEST_ROOT"/{ravencoin-data,ravencoin-config,electrumx-data,monitor-data}
          cat >> .env <<EOF
          RAVENCOIN_DATA_HOST_DIR=$STORAGE_TEST_ROOT/ravencoin-data
          RAVENCOIN_CONFIG_HOST_DIR=$STORAGE_TEST_ROOT/ravencoin-config
          ELECTRUMX_DATA_HOST_DIR=$STORAGE_TEST_ROOT/electrumx-data
          MONITOR_DATA_HOST_DIR=$STORAGE_TEST_ROOT/monitor-data
          EOF
          docker compose -f compose.yaml -f compose.storage.yaml config --quiet
          docker compose -f compose.yaml -f compose.storage.yaml -f compose.chainstrap.yaml config --quiet
          docker compose -f compose.yaml -f compose.storage.yaml -f compose.chainstrap.yaml -f compose.monitor.yaml config --quiet

      - name: Publish only validated feature changes
        if: github.event_name == 'push'
        env:
          BRANCH: work/chainstrap-ravenproject
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$BRANCH)"
          rm core-safety/scripts/apply_installer_ux_progress.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'ux(installer): stream ChainStrap progress and polish wizard'
          git push origin "HEAD:$BRANCH"
