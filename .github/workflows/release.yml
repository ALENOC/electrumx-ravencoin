name: Build ElectrumX release candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact reviewed branch, tag or commit to build
        required: true
      tag:
        description: Release identity
        required: true
        default: v1.13.11
      artifact_revision:
        description: Monotonic artifact revision for this version
        required: true
        default: "0"
      release_timestamp:
        description: Reviewed ISO-8601 timestamp with timezone
        required: true
      update_public_key_hex:
        description: Independently authenticated current production Ed25519 public key (hex)
        required: true

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.tag }}-r${{ inputs.artifact_revision }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate non-secret release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT_REVISION: ${{ inputs.artifact_revision }}
          RELEASE_TIMESTAMP: ${{ inputs.release_timestamp }}
          UPDATE_PUBLIC_KEY_HEX: ${{ inputs.update_public_key_hex }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import os
          import re

          retired = "4dbeb6131495015b1c44d2d61f80d527217623e1b12dee8f34664509ee3d2b35"
          public = os.environ["UPDATE_PUBLIC_KEY_HEX"].strip().lower()
          assert re.fullmatch(r"[0-9a-f]{64}", public), "production public key is malformed"
          assert public != retired, "retired CI-held update key is forbidden"
          revision = os.environ["ARTIFACT_REVISION"]
          assert re.fullmatch(r"0|[1-9][0-9]*", revision), "artifact_revision is not canonical"
          stamp = os.environ["RELEASE_TIMESTAMP"]
          parsed = datetime.datetime.fromisoformat(stamp[:-1] + "+00:00" if stamp.endswith("Z") else stamp)
          assert parsed.tzinfo is not None, "release timestamp requires timezone"
          assert os.environ["RELEASE_TAG"].startswith("v"), "tag must start with v"
          PY

      - name: Read exact Node Monitor pin
        id: monitor
        run: |
          set -euo pipefail
          commit=$(python3 - <<'PY'
          import json
          value = json.load(open("release/install-sources.json", encoding="utf-8"))["nodeMonitor"]["commit"]
          print(value)
          PY
          )
          test "${#commit}" = 40
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out exact Node Monitor source
        env:
          MONITOR_COMMIT: ${{ steps.monitor.outputs.commit }}
        run: |
          set -euo pipefail
          monitor="$RUNNER_TEMP/ravencoin-node-monitor"
          git init "$monitor"
          git -C "$monitor" remote add origin https://github.com/ALENOC/ravencoin-node-monitor.git
          git -C "$monitor" fetch --depth 1 origin "$MONITOR_COMMIT"
          git -C "$monitor" checkout --detach FETCH_HEAD
          test "$(git -C "$monitor" rev-parse HEAD)" = "$MONITOR_COMMIT"
          test -z "$(git -C "$monitor" status --porcelain)"

      - name: Build unsigned deterministic candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT_REVISION: ${{ inputs.artifact_revision }}
          RELEASE_TIMESTAMP: ${{ inputs.release_timestamp }}
          UPDATE_PUBLIC_KEY_HEX: ${{ inputs.update_public_key_hex }}
        run: |
          set -euo pipefail
          python3 core-safety/scripts/build_production_release.py \
            --monitor-dir "$RUNNER_TEMP/ravencoin-node-monitor" \
            --output-dir "$RUNNER_TEMP/release-candidate" \
            --tag "$RELEASE_TAG" \
            --artifact-revision "$ARTIFACT_REVISION" \
            --release-timestamp "$RELEASE_TIMESTAMP" \
            --update-public-key-hex "$UPDATE_PUBLIC_KEY_HEX"
          cd "$RUNNER_TEMP/release-candidate"
          sha256sum --check SHA256SUMS.build
          test ! -e release-manifest.json

      - name: Assert private signing and publication are absent
        run: |
          set -euo pipefail
          test -z "${ELECTRUMX_UPDATE_SIGNING_KEY:-}"
          ! grep -R --line-number -E 'gh release (create|edit)|contents:[[:space:]]*write' \
            .github/workflows/release.yml

      - name: Upload unsigned candidate only
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: release-candidate-${{ inputs.tag }}-r${{ inputs.artifact_revision }}
          path: ${{ runner.temp }}/release-candidate/
          if-no-files-found: error
          retention-days: 7
