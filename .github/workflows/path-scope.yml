name: Protected path scope

on:
  pull_request:

permissions:
  contents: read

jobs:
  path-scope:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request history without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify protected repository boundaries
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" != "$HEAD_SHA"
          python3 core-safety/scripts/verify_path_scope.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"
