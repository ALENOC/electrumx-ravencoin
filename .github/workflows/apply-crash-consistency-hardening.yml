name: Apply monitor network and reboot resilience

on:
  push:
    branches:
      - work/chainstrap-ravenproject
    paths:
      - tools/apply_monitor_network_resilience.py
      - tools/fix_monitor_resilience_regressions.py
      - .github/workflows/apply-crash-consistency-hardening.yml
  pull_request:
    branches:
      - master
    paths:
      - tools/apply_monitor_network_resilience.py
      - tools/fix_monitor_resilience_regressions.py
      - .github/workflows/apply-crash-consistency-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-monitor-network-resilience-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'work/chainstrap-ravenproject'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      MONITOR_SHA: b59e7efdea2fe8c0114b5f72e139931fe86ae571
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Refuse stale hardening
        run: |
          set -euo pipefail
          git fetch origin work/chainstrap-ravenproject
          test "$(git rev-parse origin/work/chainstrap-ravenproject)" = "$TARGET_SHA"

      - name: Apply deterministic network/reboot hardening
        run: |
          set -euo pipefail
          python3 tools/apply_monitor_network_resilience.py
          python3 tools/fix_monitor_resilience_regressions.py
          # Normalize the one-shot documentation append to exactly one EOF LF.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/crash-consistency.md')
          p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          python3 -m py_compile \
            electrumx-ravencoin-install.py \
            core-safety/scripts/configure_monitor_admin_network.py
          git diff --check

      - name: Materialize clean final candidate tree
        run: |
          set -euo pipefail
          # The full-tree bundle tests intentionally reject a dirty checkout,
          # so test the exact tree that will be published, not an uncommitted patch.
          git checkout "$TARGET_SHA" -- .github/workflows/apply-crash-consistency-hardening.yml
          git rm tools/apply_monitor_network_resilience.py tools/fix_monitor_resilience_regressions.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix(installer): collision-safe monitor network and host-port recovery'
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake libleveldb-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install .
          python3 -m pip install cryptography==43.0.3 pytest==8.3.5 pytest-asyncio==0.24.0

      - name: Run full ElectrumX regression suite
        run: |
          set -euo pipefail
          pytest -q

      - name: Exercise pinned Node Monitor reboot-publish verifier
        run: |
          set -euo pipefail
          rm -rf /tmp/ravencoin-node-monitor-ci
          git clone --quiet https://github.com/ALENOC/ravencoin-node-monitor.git /tmp/ravencoin-node-monitor-ci
          git -C /tmp/ravencoin-node-monitor-ci checkout --quiet --detach "$MONITOR_SHA"
          test "$(git -C /tmp/ravencoin-node-monitor-ci rev-parse HEAD)" = "$MONITOR_SHA"
          python3 -m py_compile /tmp/ravencoin-node-monitor-ci/contrib/verify-published-port.py
          python3 -m unittest \
            /tmp/ravencoin-node-monitor-ci/tests/test_verify_published_port.py -v

      - name: Validate collision-safe Compose models
        run: |
          set -euo pipefail
          mkdir -p .secrets vendor/ravencoin-node-monitor
          printf 'ci-user\n' > .secrets/raven_rpc_user
          printf 'ci-password-not-for-production\n' > .secrets/raven_rpc_password
          cp .env.example .env
          : > vendor/ravencoin-node-monitor/.env
          python3 core-safety/scripts/configure_monitor_admin_network.py --env-file .env
          grep -q '^MONITOR_ADMIN_SUBNET=' .env
          grep -q '^ELECTRUMX_MONITOR_ADMIN_IP=' .env
          grep -q '^MONITOR_ADMIN_IP=' .env
          docker compose -f compose.yaml -f compose.monitor.yaml config --quiet
          docker compose -f compose.yaml -f compose.tls.yaml -f compose.monitor.yaml config --quiet
          docker compose -f compose.yaml -f compose.chainstrap.yaml -f compose.monitor.yaml config --quiet

      - name: Publish validated feature changes
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin work/chainstrap-ravenproject
          test "$(git rev-parse origin/work/chainstrap-ravenproject)" = "$TARGET_SHA" || {
            echo 'branch moved during validation; refusing publication' >&2
            exit 1
          }
          git push origin HEAD:work/chainstrap-ravenproject
