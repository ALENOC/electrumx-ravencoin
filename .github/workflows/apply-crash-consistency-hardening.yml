name: Apply crash-consistency and monitor-isolation hardening

on:
  push:
    branches:
      - work/chainstrap-ravenproject
    paths:
      - tools/apply_crash_consistency_hardening.py
      - tools/patch_crash_consistency_import.py
      - .github/workflows/apply-crash-consistency-hardening.yml
  pull_request:
    branches:
      - master
    paths:
      - tools/apply_crash_consistency_hardening.py
      - tools/patch_crash_consistency_import.py
      - .github/workflows/apply-crash-consistency-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-crash-consistency-hardening-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  harden:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'work/chainstrap-ravenproject'
    runs-on: ubuntu-24.04
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Refuse stale hardening
        run: |
          set -euo pipefail
          git fetch origin work/chainstrap-ravenproject
          test "$(git rev-parse origin/work/chainstrap-ravenproject)" = "$TARGET_SHA"

      - name: Apply deterministic hardening
        run: |
          set -euo pipefail
          python3 tools/apply_crash_consistency_hardening.py
          python3 tools/patch_crash_consistency_import.py
          python3 -m py_compile \
            electrumx/lib/util.py \
            electrumx/server/db.py \
            electrumx/server/block_processor.py
          git diff --check

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake libleveldb-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install .
          python3 -m pip install cryptography==43.0.3 pytest==8.3.5 pytest-asyncio==0.24.0

      - name: Run crash-consistency and monitor regressions
        run: |
          set -euo pipefail
          pytest -q \
            tests/lib/test_util.py \
            tests/server/test_db_crash_consistency.py \
            tests/test_monitor_failure_isolation.py \
            tests/server/test_db_fs_tx_hash.py

      - name: Validate isolated monitor Compose model
        run: |
          set -euo pipefail
          mkdir -p .secrets vendor/ravencoin-node-monitor
          printf 'ci-user\n' > .secrets/raven_rpc_user
          printf 'ci-password-not-for-production\n' > .secrets/raven_rpc_password
          cp .env.example .env
          : > vendor/ravencoin-node-monitor/.env
          docker compose -f compose.yaml -f compose.monitor.yaml config --quiet
          docker compose -f compose.yaml -f compose.tls.yaml -f compose.monitor.yaml config --quiet
          docker compose -f compose.yaml -f compose.chainstrap.yaml -f compose.monitor.yaml config --quiet

      - name: Publish validated feature changes
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin work/chainstrap-ravenproject
          test "$(git rev-parse origin/work/chainstrap-ravenproject)" = "$TARGET_SHA" || {
            echo 'branch moved during validation; refusing publication' >&2
            exit 1
          }

          # Keep this workflow unchanged in the feature commit.  It is removed
          # separately through GitHub MCP after the validated code lands.
          git checkout "$TARGET_SHA" -- .github/workflows/apply-crash-consistency-hardening.yml
          git rm tools/apply_crash_consistency_hardening.py tools/patch_crash_consistency_import.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898233+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix(db): harden crash consistency and isolate node monitor failures'
          git push origin HEAD:work/chainstrap-ravenproject
