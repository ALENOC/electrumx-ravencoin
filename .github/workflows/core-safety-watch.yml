name: Core safety watch

# Watches official stable RavenProject Ravencoin Core releases, builds each exact
# candidate commit, certifies the resulting binaries/source, and prepares a
# signed safe-Core policy proposal only from conclusive reports.
#
# Security boundary:
#   * discovery, candidate build and certification run with contents: read and
#     no signing secrets;
#   * candidate source is treated as untrusted code;
#   * signing happens in a separate job bound to a protected environment, so the
#     signing key is never present in a job that executes candidate source code;
#   * pull_request never triggers this workflow, so a fork cannot reach the key;
#   * third-party actions are pinned by commit sha;
#   * the signing job accepts only an already-signed RavenProject-only policy
#     baseline at policyVersion >= 3 and advances it monotonically;
#   * the workflow only uploads a proposal artifact. It never merges, tags or
#     publishes a release automatically.
#
# A run that cannot conclusively certify a candidate leaves that identity
# retryable. Nothing is promoted because a job was inconclusive.

on:
  schedule:
    - cron: "37 4,16 * * *"
  workflow_dispatch:
    inputs:
      repository:
        description: "Restrict discovery to the official RavenProject repository"
        required: false
        type: choice
        options:
          - all
          - RavenProject/Ravencoin
        default: all

permissions:
  contents: read

concurrency:
  group: core-safety-watch
  cancel-in-progress: false

jobs:
  discover:
    name: Discover stable candidates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      candidates: ${{ steps.discover.outputs.candidates }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Restore watcher state
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: core-safety/state/processed.json
          key: core-safety-state-${{ github.run_id }}
          restore-keys: core-safety-state-

      - name: Seed processed identities from the current policy
        run: |
          set -euo pipefail
          if [ -f core-safety/state/processed.json ]; then
            exit 0
          fi
          python - <<'PY'
          import json
          import pathlib

          document = json.loads(pathlib.Path(
              "core-safety/production/safe-core-policy.json"
          ).read_text(encoding="utf-8"))
          body = document.get("policy", document)
          processed = {}
          for release in body.get("releases", []):
              repository = release.get("repository")
              commit = release.get("commit")
              if repository and commit:
                  processed[f"{repository}@{commit}"] = {
                      "tag": release.get("tag"),
                  }
          state = pathlib.Path("core-safety/state/processed.json")
          state.parent.mkdir(parents=True, exist_ok=True)
          state.write_text(json.dumps({"processed": processed}, indent=2) + "\n",
                           encoding="utf-8")
          PY

      - name: Discover stable releases from the allowed sources
        id: discover
        env:
          WATCH_REPOSITORY: ${{ inputs.repository || 'all' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p core-safety/state
          repository_args=()
          if [ "$WATCH_REPOSITORY" != "all" ]; then
            repository_args=(--repository "$WATCH_REPOSITORY")
          fi
          python core-safety/scripts/discover_releases.py \
            "${repository_args[@]}" \
            --state-file core-safety/state/processed.json \
            --output core-safety/state/new-candidates.json
          {
            echo "candidates<<EOF"
            cat core-safety/state/new-candidates.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          entries = json.loads(pathlib.Path("core-safety/state/new-candidates.json").read_text())
          print(f"count={len(entries)}")
          PY

      - name: Upload candidate records
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: core-safety-candidates
          path: core-safety/state/new-candidates.json
          if-no-files-found: error

  certify:
    name: Build exact candidate and certify
    needs: discover
    if: needs.discover.result == 'success' && needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r core-safety/requirements.txt
          python -m pip install \
            'x16r_hash @ git+https://github.com/brian112358/x16r_hash@d79211ee8b5d86a9709caefded79f318a1d9f3a8' \
            'x16rv2_hash @ git+https://github.com/RavenCommunity/x16rv2_hash@f8a9ef9a185b4c900adea4628be9b08aaab343ba'
          python -m pip install pytest==8.3.5

      - name: Run the harness self-test
        run: |
          set -euo pipefail
          python -c 'import electrumx'
          python -m pytest \
            tests/test_core_safety.py \
            tests/test_core_safety_policy.py \
            tests/test_core_safety_stable_discovery.py \
            tests/test_core_safety_workflow.py \
            -q

      - name: Build and certify each exact candidate
        env:
          CANDIDATES: ${{ needs.discover.outputs.candidates }}
        run: |
          set -euo pipefail
          mkdir -p core-safety/state/reports build/candidate
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          candidates = json.loads(os.environ["CANDIDATES"])
          reports = pathlib.Path("core-safety/state/reports")
          reports.mkdir(parents=True, exist_ok=True)

          for entry in candidates:
              repository = entry.get("repository")
              commit = entry.get("commit")
              state = entry.get("state")
              if state != "PROVENANCE_VALIDATED":
                  print(f"leaving candidate retryable: {state} {repository} "
                        f"{entry.get('tag', '')} {entry.get('reason', '')}")
                  continue
              if not commit:
                  raise RuntimeError("PROVENANCE_VALIDATED candidate has no commit")
              if repository != "RavenProject/Ravencoin":
                  raise RuntimeError(
                      f"refusing candidate outside official source: {repository}@{commit}")

              record = reports / f"candidate-{commit[:12]}.json"
              candidate_fields = {
                  "repository", "tag", "commit", "version", "tag_object",
                  "tag_verified", "commit_verified", "published_at",
                  "release_url", "artifact_name", "artifact_sha256", "notes",
              }
              record.write_text(json.dumps({
                  key: entry[key] for key in candidate_fields if key in entry
              }), encoding="utf-8")
              report = reports / f"report-{commit[:12]}.json"

              # Pin the exact bytes used by the reproducible candidate build.
              # The archive URL itself is commit-addressed; the SHA-256 prevents
              # a second fetch from silently building different bytes.
              archive = reports / f"source-{commit}.tar.gz"
              source_url = f"https://github.com/{repository}/archive/{commit}.tar.gz"
              subprocess.run([
                  "curl", "--fail", "--location", "--proto", "=https", "--tlsv1.2",
                  "--output", str(archive), source_url,
              ], check=True)
              digest = hashlib.sha256()
              with archive.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              source_sha256 = digest.hexdigest()
              archive.unlink()

              build_dir = pathlib.Path("build/candidate") / commit
              try:
                  subprocess.run([
                      "core-safety/scripts/build_candidate.sh",
                      commit, source_sha256, repository, str(build_dir),
                  ], check=True)
                  candidate_test = build_dir / "bin" / "test_raven"
                  if not candidate_test.is_file():
                      raise RuntimeError(
                          f"candidate build did not produce {candidate_test}")
                  certify_args = [
                      sys.executable, "core-safety/scripts/certify_core.py",
                      "--candidate-file", str(record),
                      "--profile", "core-safety/profiles/rvn-consensus-2026-08-v1.json",
                      "--fixtures", "core-safety/fixtures/mainnet-incident-headers.json",
                      "--source-dir", str(build_dir / "source"),
                      "--bin-dir", str(build_dir / "bin"),
                      # The certification probe suite is compiled into the exact
                      # candidate's test_raven binary. Pass it explicitly so the
                      # nHeight/checkpoint/transfer-overflow tests exercise Core,
                      # not only this project's Python fixture validator.
                      "--candidate-probe", str(candidate_test),
                      "--candidate-test-binary", str(candidate_test),
                      "--report", str(report),
                  ]
              except (subprocess.CalledProcessError, RuntimeError) as exc:
                  # Preserve fail-closed semantics. A build failure is not
                  # terminal state and is deliberately NOT entered in the
                  # processed-candidate cache below, so the next scheduled run
                  # may retry it.
                  print(f"candidate build unavailable ({exc}); recording an "
                        "inconclusive certification")
                  certify_args = [
                      sys.executable, "core-safety/scripts/certify_core.py",
                      "--candidate-file", str(record),
                      "--profile", "core-safety/profiles/rvn-consensus-2026-08-v1.json",
                      "--fixtures", "core-safety/fixtures/mainnet-incident-headers.json",
                      "--report", str(report),
                  ]

              completed = subprocess.run(certify_args, check=False)
              if not report.exists():
                  raise RuntimeError(f"certification produced no report: {report}")
              payload = json.loads(report.read_text(encoding="utf-8"))
              allowed = {"CERTIFICATION_PASSED", "CERTIFICATION_FAILED",
                         "REVIEW_REQUIRED", "BUILD_FAILED", "KNOWN_UNSAFE"}
              if payload.get("overall") not in allowed:
                  raise RuntimeError(f"invalid certification outcome in {report}")
              if completed.returncode not in (0, 1):
                  raise RuntimeError(
                      f"certification infrastructure failure for {repository}@{commit}")
              print(f"{repository}@{commit[:12]} -> {payload['overall']}")
          PY

      - name: Upload certification reports
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: core-safety-reports
          path: core-safety/state/reports
          if-no-files-found: warn

      - name: Record only terminal candidate identities
        env:
          CANDIDATES: ${{ needs.discover.outputs.candidates }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          import os
          import pathlib

          document = json.loads(pathlib.Path(
              "core-safety/production/safe-core-policy.json"
          ).read_text(encoding="utf-8"))
          body = document.get("policy", document)
          processed = {}
          for release in body.get("releases", []):
              repository = release.get("repository")
              commit = release.get("commit")
              if repository and commit:
                  processed[f"{repository}@{commit}"] = {"tag": release.get("tag")}

          candidate_by_identity = {}
          for entry in json.loads(os.environ["CANDIDATES"]):
              if entry.get("repository") and entry.get("commit"):
                  candidate_by_identity[(entry["repository"], entry["commit"])] = entry

          terminal = {"CERTIFICATION_PASSED", "CERTIFICATION_FAILED", "KNOWN_UNSAFE"}
          for report_path in glob.glob("core-safety/state/reports/report-*.json"):
              report = json.loads(pathlib.Path(report_path).read_text(encoding="utf-8"))
              if report.get("overall") not in terminal:
                  continue
              candidate = report.get("candidate") or {}
              identity = (candidate.get("repository"), candidate.get("commit"))
              discovered = candidate_by_identity.get(identity)
              if discovered is None:
                  raise RuntimeError(
                      f"terminal report {report_path} is not bound to this discovery run")
              key = f"{identity[0]}@{identity[1]}"
              processed[key] = {"tag": discovered.get("tag")}

          pathlib.Path("core-safety/state/processed.json").write_text(
              json.dumps({"processed": processed}, indent=2, sort_keys=True) + "\n",
              encoding="utf-8")
          PY

      - name: Save watcher state
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: core-safety/state/processed.json
          key: core-safety-state-${{ github.run_id }}

  propose_policy:
    name: Prepare signed policy proposal
    needs: [discover, certify]
    if: needs.certify.result == 'success'
    runs-on: ubuntu-24.04
    environment: core-safety-signing
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Install signing dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r core-safety/requirements.txt

      - name: Download certification reports
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16  # v4.1.8
        with:
          name: core-safety-reports
          path: core-safety/state/reports

      - name: Verify RavenProject-only signed baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import sys

          sys.path.insert(0, "core-safety/scripts")
          import policy

          public = bytes.fromhex(pathlib.Path(
              "core-safety/production/core-policy-signing-public-key.hex"
          ).read_text(encoding="utf-8").strip())
          if len(public) != 32:
              raise SystemExit("invalid pinned Core policy public key")
          document = json.loads(pathlib.Path(
              "core-safety/production/safe-core-policy.json"
          ).read_text(encoding="utf-8"))
          body = policy.verify_policy(
              document, {policy.key_id_for(public): public}, minimum_policy_version=3)
          known_safe = [entry for entry in body.get("releases", [])
                        if entry.get("status") == "KNOWN_SAFE"]
          if not known_safe:
              raise SystemExit("signed baseline has no KNOWN_SAFE Core identity")
          if any(entry.get("repository") != "RavenProject/Ravencoin"
                 for entry in known_safe):
              raise SystemExit("signed baseline is not RavenProject-only")
          print(f"verified policy baseline v{body['policyVersion']} with "
                f"{len(known_safe)} RavenProject KNOWN_SAFE identity/identities")
          PY

      - name: Verify report provenance against this run's discovery
        env:
          CANDIDATES: ${{ needs.discover.outputs.candidates }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          import os
          import sys

          discovered = {
              (entry.get("repository"), entry.get("commit"))
              for entry in json.loads(os.environ["CANDIDATES"])
              if entry.get("state") == "PROVENANCE_VALIDATED" and
                 entry.get("repository") and entry.get("commit")
          }
          failures = []
          for path in sorted(glob.glob("core-safety/state/reports/report-*.json")):
              report = json.loads(open(path, encoding="utf-8").read())
              candidate = report.get("candidate") or {}
              identity = (candidate.get("repository"), candidate.get("commit"))
              if identity not in discovered:
                  failures.append(f"{path}: candidate {identity} is not among "
                                  f"this run's provenance-validated candidates")
          if failures:
              print("report provenance check failed:", file=sys.stderr)
              for failure in failures:
                  print(f"  {failure}", file=sys.stderr)
              sys.exit(1)
          print(f"all downloaded reports are bound to this discovery run")
          PY

      - name: Generate and sign monotonic policy proposal
        env:
          POLICY_SIGNING_KEY: ${{ secrets.POLICY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$POLICY_SIGNING_KEY"
          reports=()
          for report in core-safety/state/reports/report-*.json; do
            [ -e "$report" ] || continue
            overall=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['overall'])" "$report")
            if [ "$overall" = "CERTIFICATION_PASSED" ] || [ "$overall" = "CERTIFICATION_FAILED" ]; then
              reports+=(--report "$report")
            else
              echo "$report is $overall; leaving it out of the policy and retrying it later"
            fi
          done
          if [ ${#reports[@]} -eq 0 ]; then
            echo "no conclusive certification report, so no policy proposal is generated"
            exit 0
          fi
          python core-safety/scripts/generate_policy.py "${reports[@]}" \
            --previous-policy core-safety/production/safe-core-policy.json \
            --profile core-safety/profiles/rvn-consensus-2026-08-v1.json \
            --output core-safety/state/safe-core-policy.json

      - name: Verify generated proposal and monotonic progression
        run: |
          set -euo pipefail
          if [ ! -f core-safety/state/safe-core-policy.json ]; then
            echo "no proposal was generated"
            exit 0
          fi
          python - <<'PY'
          import json
          import pathlib
          import sys

          sys.path.insert(0, "core-safety/scripts")
          import policy

          public = bytes.fromhex(pathlib.Path(
              "core-safety/production/core-policy-signing-public-key.hex"
          ).read_text(encoding="utf-8").strip())
          trusted = {policy.key_id_for(public): public}
          previous = policy.verify_policy(json.loads(pathlib.Path(
              "core-safety/production/safe-core-policy.json"
          ).read_text(encoding="utf-8")), trusted, minimum_policy_version=3)
          proposed = policy.verify_policy(json.loads(pathlib.Path(
              "core-safety/state/safe-core-policy.json"
          ).read_text(encoding="utf-8")), trusted,
              minimum_policy_version=previous["policyVersion"] + 1)
          if proposed["policyVersion"] != previous["policyVersion"] + 1:
              raise SystemExit("policy proposal did not advance exactly one version")
          known_safe = [entry for entry in proposed.get("releases", [])
                        if entry.get("status") == "KNOWN_SAFE"]
          if any(entry.get("repository") != "RavenProject/Ravencoin"
                 for entry in known_safe):
              raise SystemExit("proposal reintroduced a non-RavenProject trust source")
          print(f"verified signed policy proposal v{proposed['policyVersion']}")
          PY

      - name: Upload the proposed policy
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: safe-core-policy
          path: core-safety/state/safe-core-policy*.json
          if-no-files-found: warn
