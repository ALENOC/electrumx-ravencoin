services:
  electrumx:
    environment:
      SERVICES: ssl://:50002,rpc://127.0.0.1:8000
      SSL_CERTFILE: /run/electrumx/tls/fullchain.pem
      SSL_KEYFILE: /run/electrumx/tls/privkey.pem
      REPORT_SERVICES: ssl://${ELECTRUMX_PUBLIC_HOST:?set ELECTRUMX_PUBLIC_HOST in .env}:50002
    ports:
      - "50002:50002/tcp"
    volumes:
      - type: bind
        source: ${ELECTRUMX_TLS_DIRECTORY:?set ELECTRUMX_TLS_DIRECTORY in .env}
        target: /run/electrumx/tls
        read_only: true
