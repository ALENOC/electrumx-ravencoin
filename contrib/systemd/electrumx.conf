# default /etc/electrumx.conf for systemd

# See https://electrumx-ravencoin.readthedocs.io/en/latest/environment.html for
# information about other configuration settings you really probably want to consider.

# REQUIRED
DB_DIRECTORY = /var/lib/electrumx/db
# Ravencoin Node RPC Credentials
DAEMON_URL = http://username:password@127.0.0.1:8766/

COIN = Ravencoin

SERVICES = ssl://:50002
#,tcp://:50001

SSL_CERTFILE = /etc/electrumx/tls/server.crt
SSL_KEYFILE = /etc/electrumx/tls/server.key

# REQUIRED to connect with the larger electrumx ravencoin server network.
# Full service://(IP/URL):PORT is REQUIRED
# REPORT_SERVICES = ssl://your.domain.here:50002,tcp://your.domain.here:50001

# The default in-memory cache size is 1.2G
# CACHE_MB = 750

# Maximum size of a response. Default is 10,000,000 Bytes
# MAX_SEND = 5000000

COST_SOFT_LIMIT = 100000
COST_HARD_LIMIT = 300000

BANDWIDTH_UNIT_COST = 1000

EVENT_LOOP_POLICY=uvloop

# Unsafe Core versions are rejected when this variable is absent.  Never set
# it in production.  For isolated development only, the explicit value 1
# enables the dangerous override and emits critical log warnings.
# ALLOW_UNSAFE_RAVENCOIN_CORE = 1

RAVENCOIN_BACKEND_CHECK_INTERVAL = 60
RAVENCOIN_BACKEND_INFO_MAX_AGE = 5
